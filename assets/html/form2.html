<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contacto</title>
</head>
<body>
	<header>
		<nav> <!-- Barra de navegación -->
			<a href="../../index.html">Inicio</a> | <!-- Enlace de navegación -->
			<a href="tema.html">Kenpo</a> | <!-- Enlace de navegación -->
			<a href="form.html">Contacto</a> <!-- Enlace de navegación -->
			<a href="form2.html">Formulario 2</a> <!-- Enlace de navegación -->
		</nav>
	</header>
	<section>
		<h2>Contáctate con nosotros</h2>
		<form method="post" action="submit">
			<input type="text" name="nombre" id="nombre" required="true" placeholder="Nombre">
			<br>
			<br>
			<input type="email" name="email" id="email" placeholder="Ingresa tu email" required>
			<br>
			<br>
			<input type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required>
			<br>
			<br>
			<label>Selecciona tu género:</label>
			<input type="radio" name="genero" id="masculino" value="masculino" required>
			<label for="masculino">Masculino</label>
			<input type="radio" name="genero" id="femenino" value="femenino" required>
			<label for="femenino">Femenino</label>
			<br>
			<br>
			<input type="date" name="fecha_nac" id="fecha_nac" required>
			<br>
			<br>
			<input type="number" name="edad" id="edad" min="0" max="120" required placeholder="Edad">
			<br>
			<br>
			<input type="checkbox" name="enfermedad" id="enfermedad" value="si" required>
			<label for="enfermedad">¿Padeces alguna enfermedad?</label>
			<br>
			<br>
			<textarea name="comentarios" id="comentarios" cols="30" rows="5" placeholder="Escribe tus comentarios aquí..."></textarea>
			<br>
			<br>
			<input type="submit" value="Enviar">
		</form>
	</section>
</body>
</html>
